name: digest

# Среда 07:00 UTC = 10:00 МСК.
# ВАЖНО: в ПРИВАТНОМ репозитории на бесплатном плане cron не запускается.
# Репозиторий должен быть публичным либо нужен GitHub Pro.
on:
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -q -r requirements.txt

      - name: Дайджест
        env:
          MOYSKLAD_TOKEN: ${{ secrets.MOYSKLAD_TOKEN }}
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python main.py once

      - name: CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-csv
          path: digest_*.csv
          if-no-files-found: ignore
          retention-days: 30
