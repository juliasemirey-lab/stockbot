# Настройки дайджеста

# Склад, с которого пополняем. ФБО-склады НЕ указывать: товар там
# заморожен под конкретную отгрузку и в покрытие спроса не идёт.
warehouse: "Основной склад"

# Склад «Ярмарки». Входит в покрытие спроса, но НЕ в показываемый остаток:
# товар физически в другом месте, кладовщик его не найдёт, на маркетплейс он
# не выгружается. То есть заказать меньше из-за него можно, а отгрузить FBS —
# нет. Пустая строка — не учитывать вовсе.
yard_warehouse: "Ярмарки"

# За сколько дней оценивать скорость продаж.
# 28 = ровно 4 недели: одинаковое число понедельников, суббот и воскресений,
# поэтому дневной профиль недели не искажает средний темп.
# 30 дало бы смещение — два лишних дня приходятся на разные дни недели.
velocity_window_days: 28

# На сколько дней вперёд считаем потребность.
# Окно начинается с понедельника следующей недели, а не с завтрашнего дня:
# если дайджест пришёл в субботу 14-го, считаем на 16–22.
horizon_days: 7

# Страховой запас: z × разброс × √7. 1.65 ≈ 95% уровень сервиса
service_z: 1.65

# --------------------------------------------------------------------------
# Порог «🔥 Горит». Срабатывает только сочетание всех четырёх признаков:
# позиция реально ходовая И сетка у неё вымылась И дефицит стоит того, чтобы
# ехать к поставщику. Иначе в огонёк попадает хвост из двух штук.
#
# ВАЖНО: признаки считаются по дефициту БЕЗ страхового запаса.
# Позиция горит, когда товар реально кончается на этой неделе, а не когда
# просела подушка. Страховой запас — это планирование, он не создаёт срочность:
# из-за просевшей подушки к поставщику не бегут, и правильно.
# Заказ при этом считается С подушкой — её надо восполнять, просто это уже
# плановая докупка, а не пожар.
#
# Значения подобраны на реальных данных: при них в огонёк уходит 13 позиций
# из 232 (все — дубленки в разгар сезона), а не 50.
# --------------------------------------------------------------------------
hot_size_min: 3      # меньше размеров в позиции — это одиночный товар (ONE SIZE, кардиган)
hot_share: 0.70      # какая доля сетки реально вымыта (без страховки)
hot_quantile: 0.75   # продажи позиции не ниже этого квартиля когорты
hot_min_qty: 6       # реальный дефицит не меньше этого — иначе не партия


# Папки, не участвующие в расчёте
exclude_folders:
  - "Архив"
  - "Услуги"
  - "Материалы"

# --------------------------------------------------------------------------
# Сезонные профили. Четыре штуки — больше в одежде не нужно.
# --------------------------------------------------------------------------
profiles:
  winter:
    title: Зима
    pack_qty: 1
    seasonality: [1.60, 1.10, 0.50, 0.15, 0.05, 0.03, 0.05, 0.20, 0.70, 1.70, 2.00, 2.20]
  demi:
    title: Демисезон
    pack_qty: 1
    seasonality: [0.80, 1.00, 1.50, 1.60, 0.90, 0.40, 0.25, 0.40, 1.30, 1.50, 0.90, 0.70]
  summer:
    title: Лето
    pack_qty: 3
    seasonality: [0.40, 0.80, 1.80, 2.60, 2.40, 1.70, 1.10, 0.60, 0.30, 0.15, 0.10, 0.20]
  knit:
    title: Трикотаж
    pack_qty: 3
    seasonality: [1.30, 1.00, 0.80, 0.60, 0.50, 0.50, 0.60, 0.90, 1.30, 1.60, 1.50, 1.90]
  default:
    title: Всесезон
    pack_qty: 1
    seasonality: [1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00]

# --------------------------------------------------------------------------
# Ключевые слова -> профиль. ПЕРВОЕ совпадение выигрывает,
# поэтому порядок важен: сначала специфичное, потом общее.
# Проверяется по строке из категории, подкатегории, папки и названия.
# --------------------------------------------------------------------------
season_map:
  # зима: явные признаки
  - ["шуба", winter]
  - ["полушуб", winter]
  - ["дубленк", winter]
  - ["пуховик", winter]
  - ["пуховое", winter]
  - ["мехов", winter]
  - ["зимн", winter]
  - ["утеплён", winter]
  - ["утеплен", winter]

  # демисезон: до общих слов «куртка», «пальто»
  - ["тренч", demi]
  - ["демисезон", demi]
  - ["ветровк", demi]
  - ["плащ", demi]
  - ["парка", demi]
  - ["бомбер", demi]
  - ["косух", demi]
  - ["пальто", demi]
  - ["куртк", demi]
  - ["жилет", demi]

  # лето и пляж
  - ["купальник", summer]
  - ["плавки", summer]
  - ["бандо", summer]
  - ["пляжн", summer]
  - ["сарафан", summer]
  - ["шорты", summer]
  - ["бикини", summer]
  - ["парео", summer]

  # трикотаж
  - ["свитер", knit]
  - ["кардиган", knit]
  - ["джемпер", knit]
  - ["худи", knit]
  - ["свитшот", knit]
  - ["водолазк", knit]
  - ["лонгслив", knit]
  - ["трикотаж", knit]
  - ["вязан", knit]

# --------------------------------------------------------------------------
# Wildberries. Нужен WB_TOKEN с категорией «Контент».
# Без токена дайджест работает, просто без ссылок.
# --------------------------------------------------------------------------
wildberries:
  enabled: true
  # сколько дней держать кэш карточек (качать тысячи карточек каждый раз — долго)
  cache_days: 3
