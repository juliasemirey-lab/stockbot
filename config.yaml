# Конфигурация дайджеста по остаткам и потребности в закупке

timezone: Europe/Moscow

# Дайджест приходит в среду в 10:00 и считает СЛЕДУЮЩУЮ неделю (пн–вс).
# Окно всегда начинается с ближайшего понедельника после дня запуска.
schedule:
  day_of_week: wed
  hour: 10
  minute: 0

# --- Окно и буфер --------------------------------------------------------
horizon_days: 7               # длина окна: пн–вс
velocity_window_days: 28      # окно оценки скорости спроса
service_z: 1.65               # 95% уровень сервиса
top_n_in_chat: 8

replenishment:
  # Время от решения до товара на нашем складе: проверить наличие у
  # поставщика, сформировать закупку, привезти. Отсюда дата, к которой
  # заказ должен быть размещён, чтобы попасть в окно.
  handling_days: 3

# --- Склад ---------------------------------------------------------------
# Учитывается только этот склад: остатки других не смешиваются.
warehouse: "Основной склад"

# Профиль дня недели (пн..вс), нормируется к среднему 1.0.
# Для полного окна пн–вс сумма весов = 7, влияние на итог нейтральное,
# но сортировка внутри недели учитывает более горячие дни.
dow_profile: [0.85, 0.85, 0.90, 1.00, 1.25, 1.35, 1.10]

seasonality:
  winter_outer:    [1.60, 1.10, 0.50, 0.15, 0.05, 0.03, 0.05, 0.20, 0.70, 1.70, 2.00, 2.20]
  knitwear:        [1.30, 1.00, 0.80, 0.60, 0.50, 0.50, 0.60, 0.90, 1.30, 1.60, 1.50, 1.90]
  blouses:         [1.05, 1.20, 1.30, 1.10, 1.00, 0.90, 0.85, 1.00, 1.30, 1.15, 0.90, 1.30]
  swim_one_piece:  [0.40, 0.80, 1.80, 2.60, 2.40, 1.70, 1.10, 0.60, 0.30, 0.15, 0.10, 0.20]
  swim_separate:   [0.40, 0.80, 1.80, 2.60, 2.40, 1.70, 1.10, 0.60, 0.30, 0.15, 0.10, 0.20]
  swim_set:        [0.40, 0.80, 1.80, 2.60, 2.40, 1.70, 1.10, 0.60, 0.30, 0.15, 0.10, 0.20]

categories:
  winter_outer:   {title: Зимняя верхняя одежда, pack_qty: 6}
  knitwear:       {title: Трикотаж, pack_qty: 6}
  blouses:        {title: Блузки, pack_qty: 6}
  swim_one_piece: {title: Купальники слитные, pack_qty: 3}
  swim_separate:  {title: Купальники раздельные, pack_qty: 3}
  swim_set:       {title: Купальные костюмы, pack_qty: 1}

# --- Поставщики ----------------------------------------------------------
# lead_time_days — реальный срок пополнения ОТ ЭТОГО ПОСТАВЩИКА.
# Не задан → используется replenishment.handling_days (3 дня).
# Если у поставщика заказ идёт с фабрики 30–60 дней, укажите это честно:
# позиции попадут в «не успевает к окну», и это будет правдой.
suppliers:
  "ООО Текстиль-Опт":
    pack_qty: 6
    contact: "@tekstil_opt"
  "ИП Смирнова":
    pack_qty: 3
    contact: "+7 900 000-00-00"
  "Marmaris Textile":
    pack_qty: 6
    lead_time_days: 12        # импорт: дольше, чем 3 дня
    contact: "supplier@marmaris.example"

supplier_attribute: "Поставщик"

# --- Маркетплейс ---------------------------------------------------------
# Баркоды берутся из WB Content API: sizes[].skus[] — там лежат И основной,
# И дополнительный баркод. Сопоставление с ean13/gtin МойСклад по всем сразу.
wildberries:
  enabled: true
  page_limit: 100
  cache_ttl_minutes: 720
  cache_path: "/tmp/wb_barcode_index.json"
  search_fallback: true
  search_url: "https://www.wildberries.ru/catalog/0/search.aspx?search={q}"

order_organization_href: ""
order_store_href: ""

exclude_folders: ["Архив", "Услуги"]

folder_map:
  "верхняя одежда": winter_outer
  "пуховик": winter_outer
  "пальто": winter_outer
  "трикотаж": knitwear
  "джемпер": knitwear
  "блуз": blouses
  "рубаш": blouses
  "купальник сл": swim_one_piece
  "слитн": swim_one_piece
  "купальник разд": swim_separate
  "раздельн": swim_separate
  "купальный костюм": swim_set
  "пляжн": swim_set
