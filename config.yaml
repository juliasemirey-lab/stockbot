# Настройки дайджеста

# Склад, с которого пополняем. ФБО-склады НЕ указывать: товар там
# заморожен под конкретную отгрузку и в покрытие спроса не идёт.
warehouse: "Основной склад"

# За сколько дней оценивать скорость продаж
velocity_window_days: 28

# На сколько дней вперёд считаем потребность
horizon_days: 7

# Страховой запас: z × разброс × √7. 1.65 ≈ 95% уровень сервиса
service_z: 1.65

# Сколько позиций в сообщении (остальное — в CSV)
top_n_in_chat: 15

# Папки, не участвующие в расчёте
exclude_folders:
  - "Архив"
  - "Услуги"
  - "Материалы"

# --------------------------------------------------------------------------
# Сезонные профили. Четыре штуки — больше в одежде не нужно.
# --------------------------------------------------------------------------
profiles:
  winter:
    title: Зима
    pack_qty: 1
    seasonality: [1.60, 1.10, 0.50, 0.15, 0.05, 0.03, 0.05, 0.20, 0.70, 1.70, 2.00, 2.20]
  demi:
    title: Демисезон
    pack_qty: 1
    seasonality: [0.80, 1.00, 1.50, 1.60, 0.90, 0.40, 0.25, 0.40, 1.30, 1.50, 0.90, 0.70]
  summer:
    title: Лето
    pack_qty: 3
    seasonality: [0.40, 0.80, 1.80, 2.60, 2.40, 1.70, 1.10, 0.60, 0.30, 0.15, 0.10, 0.20]
  knit:
    title: Трикотаж
    pack_qty: 3
    seasonality: [1.30, 1.00, 0.80, 0.60, 0.50, 0.50, 0.60, 0.90, 1.30, 1.60, 1.50, 1.90]
  default:
    title: Всесезон
    pack_qty: 1
    seasonality: [1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00]

# --------------------------------------------------------------------------
# Ключевые слова -> профиль. ПЕРВОЕ совпадение выигрывает,
# поэтому порядок важен: сначала специфичное, потом общее.
# Проверяется по строке из категории, подкатегории, папки и названия.
# --------------------------------------------------------------------------
season_map:
  # зима: явные признаки
  - ["шуба", winter]
  - ["полушуб", winter]
  - ["дубленк", winter]
  - ["пуховик", winter]
  - ["пуховое", winter]
  - ["мехов", winter]
  - ["зимн", winter]
  - ["утеплён", winter]
  - ["утеплен", winter]

  # демисезон: до общих слов «куртка», «пальто»
  - ["тренч", demi]
  - ["демисезон", demi]
  - ["ветровк", demi]
  - ["плащ", demi]
  - ["парка", demi]
  - ["бомбер", demi]
  - ["косух", demi]
  - ["пальто", demi]
  - ["куртк", demi]
  - ["жилет", demi]

  # лето и пляж
  - ["купальник", summer]
  - ["плавки", summer]
  - ["бандо", summer]
  - ["пляжн", summer]
  - ["сарафан", summer]
  - ["шорты", summer]
  - ["бикини", summer]
  - ["парео", summer]

  # трикотаж
  - ["свитер", knit]
  - ["кардиган", knit]
  - ["джемпер", knit]
  - ["худи", knit]
  - ["свитшот", knit]
  - ["водолазк", knit]
  - ["лонгслив", knit]
  - ["трикотаж", knit]
  - ["вязан", knit]

# --------------------------------------------------------------------------
# Wildberries. Нужен WB_TOKEN с категорией «Контент».
# Без токена дайджест работает, просто без ссылок.
# --------------------------------------------------------------------------
wildberries:
  enabled: true
  # если баркод не нашёлся в карточках — дать ссылку на поиск по артикулу
  search_fallback: true
